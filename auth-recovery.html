<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>重置密码 · P.E.R Bryce Briss</title>
  <link rel="icon" href="assets/star.svg"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="styles.css" rel="stylesheet">
</head>
<body>
  <main class="platform-wrap"><section class="panel-glass">
    <p class="platform-kicker">ACCOUNT RECOVERY</p><h1 class="platform-title">重置密码</h1>
    <p id="recoveryState" class="platform-muted" role="status" aria-live="polite">正在检查恢复会话…</p>
    <form id="recoveryForm" class="d-none"><label class="form-label text-light" for="newPassword">新密码</label><input id="newPassword" class="form-control mb-3" type="password" minlength="8" autocomplete="new-password" required><label class="form-label text-light" for="newPasswordConfirm">再次输入新密码</label><input id="newPasswordConfirm" class="form-control mb-3" type="password" minlength="8" autocomplete="new-password" required><button class="btn btn-silver" type="submit">保存新密码</button></form>
    <p id="recoveryMessage" class="small mt-3" role="status" aria-live="polite"></p><div class="mt-3"><a class="btn btn-outline-silver" href="community.html">返回读者社区</a> <a class="btn btn-outline-silver" href="admin.html">返回创作者后台</a></div>
  </section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="platform.js"></script><script src="auth-service.js"></script><script src="auth-recovery.js"></script>
</body>
</html>
